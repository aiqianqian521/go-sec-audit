name: test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  # The Windows runner console defaults to the charmap codec, so any non-ASCII output
  # (a report echoes the absolute path it scanned, which may contain non-ASCII) would
  # raise UnicodeEncodeError. Force UTF-8 for all three platforms.
  PYTHONIOENCODING: utf-8

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
        exclude:
          # ubuntu-latest is already 24.04 and setup-python has no 3.9 build for it;
          # Linux 3.9 coverage is handled by the ubuntu-22.04 leg added below
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-22.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Show Python version
        run: python --version

      - name: Rule self-test (incl. mutation: breaking a rule must fail the assertions)
        run: python scripts/test_scan_sinks.py

      - name: Keyword-channel regression (parses regexes from vuln-features.md)
        run: python assets/stress/stress_kwcheck.py

      - name: Scanner smoke test (the planted corpus must yield candidates)
        run: python scripts/scan_sinks.py assets/stress --quiet

      - name: Retriever smoke test
        run: python scripts/kb_retrieve.py --list

      - name: Assert zero false positives on the negative sample
        shell: bash
        run: |
          out=$(python scripts/scan_sinks.py assets/stress 2>&1)
          if echo "$out" | grep -q "neg_safe.go"; then
            echo "::error::neg_safe.go was hit by the scanner: negative-sample false positive"
            echo "$out" | grep "neg_safe.go"
            exit 1
          fi
          echo "zero false positives on the negative sample"
